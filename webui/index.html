<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battery Monitor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Barra di Navigazione -->
  <nav>
    <button id="btn-home" class="nav-btn active">🏠</button>
    <button id="btn-settings" class="nav-btn">⚙️</button>
    <button id="btn-theme" class="nav-btn theme-toggle">🌙</button>
  </nav>

  <!-- Stato della connessione WebSocket -->
  <div id="ws-status" class="status-bar offline">Disconnesso</div>

  <main>
    <!-- PAGINA HOME (DASHBOARD) -->
    <section id="page-home" class="page-section">
      <!-- Sezione Batteria -->
      <div class="card">
        <h3>🔋 Battery</h3>
        <div class="grid-2">
          <div>Voltage: <span id="batt-voltage">--</span> V</div>
          <div>Current: <span id="batt-current">--</span> A</div>
          <div>State of charge: <span id="batt-soc">--</span> %</div>
          <div>Autonomy: <span id="batt-autonomy">--</span> hours</div>
          <div>Temperature: <span id="batt-temperature">--</span> °C</div>
          <div>State of sensors: <span id="batt-sensors">--</span></div>
        </div>
        <div class="control-group">
          <label>Min temperature: <span id="val-batt-lt">--</span> °C</label>
          <input type="range" id="slider-batt-lt" min="-10" max="10" value="5">
        </div>
       </div>

      <!-- Sezione Luci (Slider) -->
      <div id="light-container" class="card hidden">
        <h3>💡 Light</h3>
        <div class="control-group">
          <label>Brightness: <span id="val-light-brightness">--</span>%</label>
          <input type="range" id="slider-light-brightness" min="0" max="100" value="0">
        </div>
        <div class="switch-container">
          <label>Auto (motion detection): <span id="txt-light-auto">ON</span></label>
          <label class="switch">
            <input type="checkbox" id="switch-light-auto" checked />
            <span class="slider-toggle"></span>
          </label>  
        </div>
        <div class="control-group">
          <label>Auto ON brightness: <span id="val-light-auto_br">25</span>%</label>
          <input type="range" id="slider-light-auto_br" min="1" max="100" value="25">
        </div>
        <div class="control-group">
          <label>Auto ON duration: <span id="val-light-auto_dr">40</span>s</label>
          <input type="range" id="slider-light-auto_dr" min="10" max="60" value="40">
        </div>
      </div>

      <!-- Sezione Prese (Power Outlets) -->
      <div id="outlets-container" class="card">
        <h3>🔌 Power Outlets</h3>
      </div>
    </section>

    <!-- PAGINA SETTINGS & UPLOAD -->
    <section id="page-settings" class="page-section hidden">
      <!-- Form Parametri -->
      <div class="card">
        <h3>⚙️ Settings</h3>
        <form id="form-settings" onsubmit="return false;">
          <div class="form-group">
            <label>System name:</label>
            <input id="stg-display_name" type="text" name="display_name" required minlength="1">
          </div>
          <div class="form-group">
            <label>Hostname:</label>
            <input id="stg-hostname" type="text" name="hostname" required minlength="1">
          </div>
          <div class="form-group">
            <label>Main Wi-Fi SSID:</label>
            <input id="stg-main_ssid" type="text" name="main_ssid" required minlength="2">
          </div>
          <div class="form-group">
            <label>Main Wi-Fi Password:</label>
            <input id="stg-main_psk" type="password" name="main_psk" minlength="8">
          </div>
          <div class="form-group">
            <label>Alt. Wi-Fi SSID:</label>
            <input id="stg-alt_ssid" type="text" name="alt_ssid" required minlength="2">
          </div>
          <div class="form-group">
            <label>Alt. Wi-Fi Password:</label>
            <input id="stg-alt_psk" type="password" name="alt_psk" minlength="8">
          </div>
          <div class="form-group">
            <label>Access-Point mode Password:</label>
            <input id="stg-ap_psk" type="password" name="ap_psk" minlength="8">
          </div>
          <div class="form-group">
            <label>Don't be default gateway (when in AP mode):</label>
            <input id="stg-ap_no_def_gw" type="checkbox" name="ap_no_def_gw" >
          </div>
          
          <button type="submit" class="btn-submit">Save settings</button>
        </form>
      </div>

      <!-- Form Aggiornamento Firmware / Filesystem -->
      <div class="card">
        <h3>🚀 System update (OTA)</h3>
        <form action="/update" method="POST" enctype="multipart/form-data">
          <div class="form-group">
            <label>Firmware (.bin):</label>
            <input type="file" name="firmware" accept=".bin">
          </div>
          <div class="form-group">
            <label>Filesystem (.bin):</label>
            <input type="file" name="filesystem" accept=".bin">
          </div>
          <button type="submit" class="btn-submit btn-danger">Start update</button>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="/main.js"></script>
</body>
</html>
