# --------------------------------------------------
      
# ===========================================================================
#                                  BUTTONS
# ===========================================================================
button:
  - platform: template
    name: "Reset SoC al 100%"
    icon: "mdi:refresh"
    web_server:
      sorting_group_id: sg_actions
      sorting_weight: 10
    on_press:
      then:
        - lambda: |-
            id(current_soc) = 100.0;
            id(soc_percentage_output).publish_state(100.0);
            ESP_LOGI("bms", "SoC reset to 100%%");

  - platform: template
    name: "Salva SoC"
    icon: "mdi:flash"
    web_server:
      sorting_group_id: sg_actions
      sorting_weight: 11
    on_press:
      then:
        - lambda: |-
            ESP_LOGI("bms", "SoC saved, manually triggered.");

# ===========================================================================
#                            BINARY SENSORS
# ===========================================================================
binary_sensor:

  # PIR sensor & automation
  - platform: gpio
    pin: GPIO13 # Pin D7 - Sensore PIR AM312
    name: "Rilevamento Movimento"
    id: pir_sensor
    device_class: motion
    internal: true
    on_press:
      then:
        # Checks if automation is enabled and light is not already on
        - if:
            condition:
              and:
                - switch.is_on: enable_pir
                - light.is_off: red_light
            then:
              - light.turn_on:
                  id: red_light
                  brightness: !lambda "return id(pir_target_brightness).state / 100.0;"
    on_release:
      then:
        - if:
            condition:
              switch.is_on: enable_pir
            then:
              - delay: !lambda "return id(pir_auto_turnoff_delay).state;"
              - light.turn_off: red_light


# ===========================================================================
#                                   SENSORS
# ===========================================================================
sensor:
  # ------------- Battery temperature and cold-protection automation
  - platform: dallas_temp
    one_wire_id: one_wire_gpio_1
    name: "Temperatura"
    id: temp_battery_bay
    update_interval: 10s
    icon: "mdi:thermometer"
    web_server:
      sorting_group_id: sg_battery
      sorting_weight: 5
    on_value:
      then:
        - lambda: |-
            if (id(enable_auto_heater).state) {
              // Se la temperatura scende sotto i 5.0°C, attiva il MOSFET del riscaldamento
              if (x <= id(heater_threshold_min).state) {
                id(output_heater).set_level(1.0); // Accende al 100% della potenza PWM
                ESP_LOGI("bms_thermal", "Temperatura critica! Riscaldatore ATTIVATO.");
              }
              // Se la temperatura sale sopra i 9.0°C, spegne il riscaldamento
              else if (x >= id(heater_threshold_max).state) {
                id(output_heater).set_level(0.0); // Spegne il PWM
                ESP_LOGI("bms_thermal", "Temperatura di sicurezza raggiunta. Riscaldatore SPENTO.");
              }
            }

  # ------------- Battery voltage and current sensing
  - platform: ina226
    address: 0x40
    shunt_resistance: 0.002 ohm
    max_current: 20.0
    bus_voltage:
      name: "Tensione (V)"
      id: battery_voltage
      icon: "mdi:plus-minus-variant"
      web_server:
        sorting_group_id: sg_battery
        sorting_weight: 3
      accuracy_decimals: 2
      on_value_range:
        - above: 14.15
          then:
            - lambda: |-
                id(current_soc) = 100.0;
                ESP_LOGI("bms", "Carica completa (target 14.2V)");
    current:
      name: "Corrente (A)"
      id: ist_current
      accuracy_decimals: 3
      icon: "mdi:flash"
      web_server:
        sorting_group_id: sg_battery
        sorting_weight: 4
      # invert current sign if INA226 cabled in standard mode,
      # i.e. INA226+ --> Battery+
      filters:
        - multiply: -1.0

  # ------------- Ampere/hour integration
  - platform: integration
    sensor: ist_current
    name: "Ampere Ora Integrati"
    internal: true
    id: ah_integrated
    time_unit: h
    integration_method: trapezoid
    accuracy_decimals: 4
    on_value:
      then:
        - lambda: |-
            float delta_ah = x;
            float calcolo_soc = id(current_soc) + (delta_ah / id(total_capacity_ah) * 100.0);
            if (calcolo_soc > 100.0) calcolo_soc = 100.0;
            if (calcolo_soc < 0.0) calcolo_soc = 0.0;
            id(current_soc) = calcolo_soc;
            id(soc_percentage_output).publish_state(id(current_soc));


  # ------------- SoC
  - platform: template
    name: "Carica"
    id: soc_percentage_output
    unit_of_measurement: "%"
    accuracy_decimals: 1
    icon: "mdi:battery"
    web_server:
      sorting_group_id: sg_battery
      sorting_weight: 1
    update_interval: 5s
    on_value_range:
      - below: 15.0
        then:
          - light.turn_off: red_light
          # Channel 3 & 4
          #- light.turn_off: channel_3_dimmer
          #- light.turn_off: channel_4_dimmer
          #- switch.turn_off: channel_3_switch
          #- switch.turn_off: channel_4_switch
          - lambda: |-
              ESP_LOGW("bms_safe", "Soglia minima SoC raggiunta! Funzioni accessorie spente.");

  # ------------- 10 min window current averaging
  - platform: template
    id: average_current_10min
    internal: true
    update_interval: 5s
    lambda: return id(ist_current).state;
    filters:
      # Campionando ogni 5 secondi, 120 valori corrispondono esattamente a 10 minuti (120 * 5s = 600s)
      - sliding_window_moving_average:
          window_size: 120
          send_every: 1

  # ------------- remaining time
  - platform: template
    name: "Autonomia"
    id: time_remaining_output
    unit_of_measurement: "h"
    web_server:
      sorting_group_id: sg_battery
      sorting_weight: 2
    accuracy_decimals: 1
    update_interval: 10s
    lambda: |-
      float soc = id(current_soc);
      float average = id(average_current_10min).state;
      float capacity = id(total_capacity_ah);

      if (soc <= 15.0) {
        return 0.0;
      }
      if (average >= -0.02) {
        return 999.0;
      }
      float discharge_current = abs(average);
      float ah_available = ((soc - 15.0) * capacity) / 100.0;
      return ah_available / discharge_current;
    icon: "mdi:timer-sand"
    
# ===========================================================================
#                                   BLE TRANSMITTER (BTHome v2)
# ===========================================================================

# 1. FORZIAMO l'accensione fisica dell'hardware radio Bluetooth sotto ESP-IDF
esp32_ble:
  id: ble_hardware
  advertising: true # <-- TASSATIVO: dice a ESPHome di inizializzare la radio BLE al boot!

interval:
  - interval: 5s
    then:
      - lambda: |-
          // Estraiamo i valori attuali dai sensori dello YAML
          uint8_t soc_val = (uint8_t)id(current_soc);
          uint16_t volt_val = (uint16_t)(id(battery_voltage).state * 1000.0f);
          int16_t curr_val = (int16_t)(id(ist_current).state * 1000.0f);

          // 2. Set Device Name (Inizializzazione formale dell'identità radio)
          static bool name_set = false;
          if (!name_set) {
            esp_ble_gap_set_device_name("BMS-Rig");
            name_set = true;
          }

          // Puliamo la memoria per i parametri dell'antenna
          esp_ble_adv_data_t adv_data;
          std::memset(&adv_data, 0, sizeof(esp_ble_adv_data_t));

          // Costruiamo il payload Service Data per BTHome v2
          std::vector<uint8_t> payload;
          
          // Flags Standard BLE (3 byte)
          payload.push_back(0x02); 
          payload.push_back(0x01); 
          payload.push_back(0x06); 

          // Nome Locale nel pacchetto (8 byte: 1 len + 1 tipo + 6 caratteri "BMS-Rig")
          payload.push_back(0x07); 
          payload.push_back(0x09); 
          payload.push_back('B'); payload.push_back('M'); payload.push_back('S');
          payload.push_back('-'); payload.push_back('R'); payload.push_back('i'); payload.push_back('g');

          // Blocco Dati BTHome v2 (UUID 0xFCD2)
          payload.push_back(0x0C); 
          payload.push_back(0x16); // Service Data - 16bit UUID
          payload.push_back(0xD2); // BTHome UUID Low Byte
          payload.push_back(0xFC); // BTHome UUID High Byte
          payload.push_back(0x40); // Device Info (v2, non crittografato)

          // SENSUR 1: STATO DI CARICA (ID 0x01, 1 byte)
          payload.push_back(0x01);
          payload.push_back(soc_val);

          // SENSUR 2: TENSIONE (ID 0x0C, 2 byte, fattore 0.001V)
          payload.push_back(0x0C);
          payload.push_back(volt_val & 0xFF);
          payload.push_back((volt_val >> 8) & 0xFF);

          // SENSUR 3: CORRENTE (ID 0x43, 2 byte, int16 signed, fattore 0.001A)
          payload.push_back(0x43);
          payload.push_back(curr_val & 0xFF);
          payload.push_back((curr_val >> 8) & 0xFF);

          // Configurazione dei parametri dell'antenna per ESP-IDF 5
          adv_data.set_scan_rsp = false;
          adv_data.include_name = false; 
          adv_data.include_txpower = false;
          adv_data.p_service_data = payload.data();
          adv_data.service_data_len = payload.size();

          // Configura i dati strutturati nell'interfaccia radio dell'ESP32
          esp_ble_gap_config_adv_data(&adv_data);

          // Parametri di trasmissione (intervallo e tipo di pacchetto)
          esp_ble_adv_params_t adv_params;
          std::memset(&adv_params, 0, sizeof(esp_ble_adv_params_t));
          adv_params.adv_int_min = 0x0040; // ~40ms
          adv_params.adv_int_max = 0x0080; // ~80ms
          adv_params.adv_type = ADV_TYPE_NONCONN_IND; // Non connettibile (Beacon puro)
          adv_params.own_addr_type = BLE_ADDR_TYPE_PUBLIC;
          adv_params.channel_map = ADV_CHNL_ALL;
          adv_params.adv_filter_policy = ADV_FILTER_ALLOW_SCAN_ANY_CON_ANY;

          // Sovrascrive l'advertising di default e inizia a irradiare i nostri dati
          esp_ble_gap_start_advertising(&adv_params);
          
          ESP_LOGD("ble_bms", "Beacon BTHome v2 inviato nell'aria.");

