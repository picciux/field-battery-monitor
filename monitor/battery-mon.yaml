##################### GPIO Mapping #####################
#
# Board mappings
# GPIO0  --> push button --> GND
# GPIO16 --> MOSFET CH1
# GPIO17 --> MOSFET CH2
# GPIO23 --> Onboard LED
# GPIO26 --> MOSFET CH3 (4 channels modules)
# GPIO27 --> MOSFET CH4 (4 channels modules)
#
# External mappings
# GPIO13 --> PIR sensor
# GPIO19 --> I2C SCL (INA226)
# GPIO21 --> I2C SDA (INA226)
# GPIO25 --> OneWire (Dallas temperature sensor)
# 
##################### GPIO Mapping #####################

esphome:
  name: battery50ah
  friendly_name: Batteria 50Ah Matteo
  on_boot:
    priority: -100 # Attende che tutti i componenti siano pronti
    then:
      - script.execute: ciclo_respiro_eco
        
esp32:
  board: esp32dev
  framework:
    type: esp-idf
  # Ottimizzazione dello schema delle partizioni per fare spazio a Wi-Fi + BLE insieme
  #board_build.partitions: min_spiffs.csv

ota:
  - platform: esphome
    password: !secret ota_update_password

logger:
  level: INFO
  
preferences:

wifi:
  networks:
    - ssid: !secret wifi_field_ssid
      password: !secret wifi_field_password
      priority: 10.0
    - ssid: !secret wifi_field_ssid2
      password: !secret wifi_field_password2
      priority: 9
    - ssid: !secret wifi_home_ssid
      password: !secret wifi_home_password
      priority: 5
    - ssid: !secret wifi_edge40hs_ssid
      password: !secret wifi_edge40hs_password
      priority: 4
  ap:
    ssid: Hotspot-Battery50-Reset
    password: !secret wifi_field_password
  reboot_timeout: 0s

captive_portal:

# UI WEB ATTIVA
web_server:
  port: 80
  version: 3
  log: true
  # Enable web-UI authentication
  #auth:
  #  username: !secret web_ui_username
  #  password: !secret web_ui_password
  sorting_groups:
    - id: sg_battery
      name: Batteria
      sorting_weight: 0
    - id: sg_ambient_light
      name: "Luce ambientale"
      sorting_weight: 1
    - id: sg_temperature
      name: "Protezione anti-gelo"
      sorting_weight: 2
    - id: sg_actions
      name: "Comandi"
      sorting_weight: 3

globals:
  - id: total_capacity_ah
    type: float
    initial_value: '50.0' # Impostato sulla tua batteria da 50Ah
  - id: current_soc
    type: float
    restore_value: yes
    initial_value: '100.0'

# ===========================================================================
#                            HARDWARE BUS & OUTPUTS
# ===========================================================================

# OneWire for DS18B20
one_wire:
  - platform: gpio
    id: one_wire_gpio_1
    pin: GPIO25

# I2C for INA226
i2c:
  sda: GPIO21
  scl: GPIO19
  scan: true

# PWM gpio outputs
output:
  - platform: ledc
    pin: GPIO23
    id: onboard_led
    channel: 0 # High speed PWM channel 
    frequency: 2441Hz # Anti-flickering high freq 

  - platform: ledc
    pin: GPIO17
    id: output_red_light
    channel: 0 # High speed PWM channel
    frequency: 2441Hz # Anti-flickering high freq

  - platform: ledc
    pin: GPIO16
    id: output_heater
    channel: 8 # Low speed PWM channel
    frequency: 10Hz # Low-noise resistive loads low freq


#  CHANNEL 3 & 4
#  Uncomment on 4 channels module
  - platform: ledc
    pin: GPIO26
    id: output_channel_3_pwm
    frequency: 1000Hz # Alta frequenza anti-flickering, sicura per le sessioni fotografiche

  - platform: ledc
    pin: GPIO27
    id: output_channel_4_pwm
    frequency: 1000Hz # Alta frequenza anti-flickering, sicura per le sessioni fotografiche

script:
  - id: ciclo_respiro_eco
    mode: restart
    then:
      - while:
          condition:
            lambda: 'return true;' # Ciclo infinito
          then:
            # --- FASE 1: RAMP-UP (Salita da 0% a 50% in 500ms) ---
            - light.turn_on:
                id: status_led
                brightness: 50%
                transition_length: 1000ms
            - delay: 1000ms # Attendi che la transizione finisca

            # --- FASE 2: RAMP-DOWN (Discesa da 50% a 0% in 500ms) ---
            - light.turn_on:
                id: status_led
                brightness: 0%
                transition_length: 1000ms
            - delay: 1000ms # Attendi che la transizione finisca
            
            # Forza lo spegnimento dello stato per azzerare i consumi
            - light.turn_off:
                id: status_led

            # --- FASE 3: PAUSA LUNGA (LED Spento) ---
            - delay: 5000ms # Pausa di 3 secondi a consumo zero

    
# ===========================================================================
#                                     LIGHTS
# ===========================================================================
light:
  - platform: monochromatic
    output: onboard_led
    name: "Onboard LED"
    id: status_led
    internal: true
  
  - platform: monochromatic
    output: output_red_light
    name: "Controllo manuale luce"
    id: red_light
    default_transition_length: 1.5s
    icon: "mdi:lightbulb-night"
    internal: true

# ===========================================================================
#                                    SWITCHES
# ===========================================================================
switch:
#     ---- CHANNEL 3 & 4 (ON/OFF mode) ----
#  - platform: output
#    output: output_channel_3_pwm
#    name: "Uscita 1"
#    id: channel_3_switch
#    restore_mode: RESTORE_DEFAULT_OFF
#    icon: "mdi:power-plug"
#    web_server:
#      sorting_group_id: sg_actions
#      sorting_weight: 1

  - platform: output
    output: output_channel_4_pwm
    name: "Uscita 2"
    id: channel_4_switch
    restore_mode: RESTORE_DEFAULT_OFF
    icon: "mdi:power-plug"
    web_server:
      sorting_group_id: sg_actions
      sorting_weight: 2
# --------------------------------------------------

  # Virtual switch to enable/disable PIR detection automation
  - platform: template
    name: "Attivazione automatica (movimento)"
    id: enable_pir
    icon: "mdi:motion-sensor"
    optimistic: true
    restore_mode: ALWAYS_ON
    web_server:
      sorting_group_id: sg_ambient_light
      sorting_weight: 1

  # Virtual switch to enable/disable cold protection automation
  - platform: template
    name: "Attivo"
    id: enable_auto_heater
    icon: "mdi:thermostat-auto"
    optimistic: true
    restore_mode: ALWAYS_ON
    web_server:
      sorting_group_id: sg_temperature
      sorting_weight: 1


# ===========================================================================
#                                      NUMBERS
# ===========================================================================
number:
  # auto light brightness
  - platform: template
    name: "Luminosità"
    id: pir_target_brightness
    icon: "mdi:brightness-6"
    min_value: 5
    max_value: 100
    step: 5
    initial_value: 25 # default initial 25%
    unit_of_measurement: "%"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: sg_ambient_light
      sorting_weight: 2

  # auto light turn off delay
  - platform: template
    name: "Ritardo spegnimento"
    id: pir_auto_turnoff_delay
    icon: "mdi:timer"
    min_value: 10
    max_value: 60
    step: 5
    initial_value: 45
    unit_of_measurement: "s"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: sg_ambient_light
      sorting_weight: 3

  # cold protection low temp thershold
  - platform: template
    name: "Soglia inferiore"
    id: heater_threshold_min
    icon: "mdi:thermometer-low"
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 5
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: sg_temperature
      sorting_weight: 2

  # cold protection high temp threshold
  - platform: template
    name: "Soglia superiore"
    id: heater_threshold_max
    icon: "mdi:thermometer"
    min_value: 0
    max_value: 15
    step: 1
    initial_value: 9
    unit_of_measurement: "°C"
    optimistic: true
    restore_value: true
    web_server:
      sorting_group_id: sg_temperature
      sorting_weight: 3

  # ---- RED Light manual control ----
  - platform: template
    name: "Regolazione manuale"
    id: red_light_manual
    icon: "mdi:lightbulb-night"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true 
    on_value:
      then:
        lambda: |-
          // Converte il valore dello slider (0-100) nel float 0.0-1.0
          float pwm_level = x / 100.0f;
          auto call=id(red_light).make_call();
          if (pwm_level == 0.0f) {
            call.set_state(false);
            call.set_brightness(0.0f);
          }else {
            call.set_brightness(pwm_level);
            call.set_state(true);
          }
          call.perform();
          // disable auto red light
          id(enable_pir).turn_off();
    web_server:
      sorting_group_id: sg_ambient_light
      sorting_weight: 4
      
  # ---- CHANNEL 3 & 4 (PWM mode) ----
  - platform: template
    name: "Uscita 1"
    id: channel_3_dimmer
    icon: "mdi:power-plug"
    min_value: 0
    max_value: 100
    step: 1
    unit_of_measurement: "%"
    optimistic: true 
    on_value:
      then:
        lambda: |-
          // Converte il valore dello slider (0-100) nel float richiesto dal PWM (0.0-1.0)
          float pwm_level = x / 100.0;
          id(output_channel_3_pwm).set_level(pwm_level);
    web_server:
      sorting_group_id: sg_actions
      sorting_weight: 1
#
#  - platform: template
#    name: "Uscita 2"
#    id: channel_4_dimmer
#    icon: "mdi:power-plug"
#    min_value: 0
#    max_value: 100
#    step: 1
#    unit_of_measurement: "%"
#    optimistic: true 
#    on_value:
#      then:
#        lambda: |-
#          // Converte il valore dello slider (0-100) nel float richiesto dal PWM (0.0-1.0)
#          float pwm_level = x / 100.0;
